<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>SingIt demo recording</title>
  <style>
    :root{color-scheme:dark;background:#0b0f17;color:#e6ebf5;font:16px/1.5 system-ui,sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:32px;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 0,#1a2440 0,transparent 70%),#0b0f17}
    main{width:min(100%,1440px);text-align:center}
    video{display:block;width:100%;max-height:82vh;background:#000;border:1px solid #303a50;border-radius:12px;box-shadow:0 24px 80px #0008}
    a{display:inline-block;margin-top:16px;color:#9fc1ff}
  </style>
</head>
<body>
  <main>
    <video src="demo.mp4" controls autoplay muted loop></video>
    <a href="demo.gif">View the animated GIF recording</a>
  </main>
</body>
</html>
